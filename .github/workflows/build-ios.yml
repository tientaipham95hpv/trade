name: Build iOS Unsigned IPA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Unsigned iOS IPA
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        run: |
          cd ios-app
          flutter pub get

      - name: 🔨 Build iOS Release (No Codesign)
        run: |
          cd ios-app
          flutter build ios --release --no-codesign

      - name: 📦 Package Runner.app to Unsigned .IPA
        run: |
          cd ios-app/build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r -q ../../../BinanceQuantPro_unsigned.ipa Payload
          cd ../../..
          ls -lh BinanceQuantPro_unsigned.ipa

      - name: 🚀 Upload IPA Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: BinanceQuantPro-iOS-Unsigned
          path: BinanceQuantPro_unsigned.ipa
          retention-days: 30

      - name: 🏷️ Publish IPA to GitHub Release (on Tags)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: BinanceQuantPro_unsigned.ipa
          name: Release ${{ github.ref_name }}
          body: |
            ## 📱 Binance Futures Quant Pro iOS App (Unsigned IPA)
            
            ### Hướng dẫn cài đặt lên iPhone / iPad:
            1. **Tải file `BinanceQuantPro_unsigned.ipa`** bên dưới về iPhone.
            2. **Cách 1 (Khuyên dùng vĩnh viễn):** Cài qua **TrollStore** (không bị giới hạn 7 ngày).
            3. **Cách 2 (Mọi iPhone iOS 15 - 18):** Ký và cài đặt qua **AltStore**, **Sideloadly**, **Scarlet** hoặc **Esign**.
            4. Mở app, vào Cài đặt kết nối tới máy chủ VPS: `https://trader.noza.site` và quản lý danh mục mọi lúc mọi nơi!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
